<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StaffSync - Staff Attendance Management System</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('staffsync_branding_cache_v1');
          if (raw) {
            var b = JSON.parse(raw);
            if (b && b.projectName) {
              document.title = b.projectName + ' — Staff Attendance Management System';
            }
            if (b && b.faviconUrl) {
              var link = document.querySelector("link[rel*='icon']");
              if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.head.appendChild(link);
              }
              link.href = b.faviconUrl;
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Production-ready Staff Attendance Management System with comprehensive Admin Panel and Employee Self-Service Portal." />
    <meta property="og:title" content="StaffSync - Staff Attendance Management System" />
    <meta property="og:description" content="Production-ready Staff Attendance Management System with comprehensive Admin Panel and Employee Self-Service Portal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9F8] text-[#151515] antialiased selection:bg-[#087A4B]/15 selection:text-[#087A4B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
